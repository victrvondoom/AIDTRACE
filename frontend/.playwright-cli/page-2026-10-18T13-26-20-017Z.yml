  - generic [ref=f1e113]:
    - generic [ref=f1e114]:
      - generic [ref=f1e115]: The problem
      - heading "The information exists. The connections are missing." [level=2] [ref=f1e116]:
        - text: The information exists.
        - generic [ref=f1e117]: The connections are missing.
      - paragraph [ref=f1e118]: A supplier disruption affects a facility. A security finding exposes a dependency. A revised document changes an earlier recommendation. When these records stay apart, people cannot see which decisions need another look.
    - generic [ref=f1e119]:
      - generic [ref=f1e120]:
        - paragraph [ref=f1e121]: "01"
        - paragraph [ref=f1e122]: What is connected?
        - paragraph [ref=f1e123]: Documents, suppliers, incidents, transactions and security findings often live in separate systems, hiding the relationships between them.
        - paragraph [ref=f1e124]: Fragmented information
      - generic [ref=f1e125]:
        - paragraph [ref=f1e126]: "02"
        - paragraph [ref=f1e127]: What changed?
        - paragraph [ref=f1e128]: A revised source can change a fact that earlier agent memory, recommendations and approvals relied on.
        - paragraph [ref=f1e129]: Changing evidence
      - generic [ref=f1e130]:
        - paragraph [ref=f1e131]: "03"
        - paragraph [ref=f1e132]: What can we trust?
        - paragraph [ref=f1e133]: A confident answer is not enough. People need to see its source, age, verification state and missing evidence.
        - paragraph [ref=f1e134]: Evidence validity
      - generic [ref=f1e135]:
        - paragraph [ref=f1e136]: "04"
        - paragraph [ref=f1e137]: What happens next?
        - paragraph [ref=f1e138]: Affected decisions need an explanation, a responsible reviewer and an audit trail before a proposed action proceeds.
        - paragraph [ref=f1e139]: Human review
    - paragraph [ref=f1e140]: AIDTRACE connects evidence and traces the consequences when information changes. The question is what the change means for decisions already made.
  - generic [ref=f1e142]:
    - generic [ref=f1e143]:
      - generic [ref=f1e144]: How it works
      - heading "One intelligence workflow. Multiple applications." [level=2] [ref=f1e145]:
        - text: One intelligence workflow.
        - generic [ref=f1e146]: Multiple applications.
      - paragraph [ref=f1e147]: Connect information, investigate its relationships, verify the evidence and bring recommendations to a person. Each extension keeps its specialized algorithms.
    - list [ref=f1e148]:
      - listitem [ref=f1e149]:
        - generic [ref=f1e151]:
          - generic [ref=f1e152]: "1"
          - generic [ref=f1e153]: Connect
        - paragraph [ref=f1e154]: Bring the evidence together
        - paragraph [ref=f1e155]: The workflow starts with authorized source records. Each extension connects the document, supplier, incident or event data it supports while preserving source identity and history.
      - listitem [ref=f1e156]:
        - generic [ref=f1e158]:
          - generic [ref=f1e159]: "2"
          - generic [ref=f1e160]: Understand
        - paragraph [ref=f1e161]: Follow the FalkorDB relationships
        - paragraph [ref=f1e162]: Source versions, claims, agent memory, decisions and proposed actions are linked. The graph records what each conclusion depends on.
      - listitem [ref=f1e163]:
        - generic [ref=f1e165]:
          - generic [ref=f1e166]: "3"
          - generic [ref=f1e167]: Investigate
        - paragraph [ref=f1e168]: Find the affected decisions
        - paragraph [ref=f1e169]: In the synthetic supplier-audit example, a verified procedure changes an inspection interval from 180 to 90 days. AIDTRACE traces the old fact to the memory and decision that used it.
      - listitem [ref=f1e170]:
        - generic [ref=f1e172]:
          - generic [ref=f1e173]: "4"
          - generic [ref=f1e174]: Verify
        - paragraph [ref=f1e175]: Check the evidence and uncertainty
        - paragraph [ref=f1e176]: The system shows the source change and the dependency path. It re-evaluates the old decision against the newer fact instead of treating remembered context as permanent truth.
      - listitem [ref=f1e177]:
        - generic [ref=f1e178]:
          - generic [ref=f1e179]: "5"
          - generic [ref=f1e180]: Review
        - paragraph [ref=f1e181]: Hold the action and retain the history
        - paragraph [ref=f1e182]: The earlier approval belongs to an older decision revision, so the synthetic proposed action is suspended. A person can inspect what changed before making a new decision.
    - paragraph [ref=f1e183]:
      - text: "The last step matters: a recommendation is only as current as the evidence and approval behind it."
      - strong [ref=f1e184]: When evidence changes, the decision must be checked again.
