  - generic [ref=e113]:
    - generic [ref=e114]:
      - generic [ref=e115]: The problem
      - heading "The information exists. The connections are missing." [level=2] [ref=e116]:
        - text: The information exists.
        - generic [ref=e117]: The connections are missing.
      - paragraph [ref=e118]: A supplier disruption affects a facility. A security finding exposes a dependency. A revised document changes an earlier recommendation. When these records stay apart, people cannot see which decisions need another look.
    - generic [ref=e119]:
      - generic [ref=e120]:
        - paragraph [ref=e121]: "01"
        - paragraph [ref=e122]: What is connected?
        - paragraph [ref=e123]: Documents, suppliers, incidents, transactions and security findings often live in separate systems, hiding the relationships between them.
        - paragraph [ref=e124]: Fragmented information
      - generic [ref=e125]:
        - paragraph [ref=e126]: "02"
        - paragraph [ref=e127]: What changed?
        - paragraph [ref=e128]: A revised source can change a fact that earlier agent memory, recommendations and approvals relied on.
        - paragraph [ref=e129]: Changing evidence
      - generic [ref=e130]:
        - paragraph [ref=e131]: "03"
        - paragraph [ref=e132]: What can we trust?
        - paragraph [ref=e133]: A confident answer is not enough. People need to see its source, age, verification state and missing evidence.
        - paragraph [ref=e134]: Evidence validity
      - generic [ref=e135]:
        - paragraph [ref=e136]: "04"
        - paragraph [ref=e137]: What happens next?
        - paragraph [ref=e138]: Affected decisions need an explanation, a responsible reviewer and an audit trail before a proposed action proceeds.
        - paragraph [ref=e139]: Human review
    - paragraph [ref=e140]: AIDTRACE connects evidence and traces the consequences when information changes. The question is what the change means for decisions already made.
  - generic [ref=e142]:
    - generic [ref=e143]:
      - generic [ref=e144]: How it works
      - heading "One intelligence workflow. Multiple applications." [level=2] [ref=e145]:
        - text: One intelligence workflow.
        - generic [ref=e146]: Multiple applications.
      - paragraph [ref=e147]: Connect information, investigate its relationships, verify the evidence and bring recommendations to a person. Each extension keeps its specialized algorithms.
    - list [ref=e148]:
      - listitem [ref=e149]:
        - generic [ref=e151]:
          - generic [ref=e152]: "1"
          - generic [ref=e153]: Connect
        - paragraph [ref=e154]: Bring the evidence together
        - paragraph [ref=e155]: Authorized documents, supplier records, incidents and operational events become the starting points for an investigation. Each source keeps its identity and history.
      - listitem [ref=e156]:
        - generic [ref=e158]:
          - generic [ref=e159]: "2"
          - generic [ref=e160]: Understand
        - paragraph [ref=e161]: Follow the FalkorDB relationships
        - paragraph [ref=e162]: Source versions, claims, agent memory, decisions and proposed actions are linked. The graph records what each conclusion depends on.
      - listitem [ref=e163]:
        - generic [ref=e165]:
          - generic [ref=e166]: "3"
          - generic [ref=e167]: Investigate
        - paragraph [ref=e168]: Find the affected decisions
        - paragraph [ref=e169]: In the synthetic supplier-audit example, a verified procedure changes an inspection interval from 180 to 90 days. AIDTRACE traces the old fact to the memory and decision that used it.
      - listitem [ref=e170]:
        - generic [ref=e172]:
          - generic [ref=e173]: "4"
          - generic [ref=e174]: Verify
        - paragraph [ref=e175]: Check the evidence and uncertainty
        - paragraph [ref=e176]: The system shows the source change and the dependency path. It re-evaluates the old decision against the newer fact instead of treating remembered context as permanent truth.
      - listitem [ref=e177]:
        - generic [ref=e178]:
          - generic [ref=e179]: "5"
          - generic [ref=e180]: Review
        - paragraph [ref=e181]: Hold the action and retain the history
        - paragraph [ref=e182]: The earlier approval belongs to an older decision revision, so the synthetic proposed action is suspended. A person can inspect what changed before making a new decision.
    - paragraph [ref=e183]:
      - text: "The last step matters: a recommendation is only as current as the evidence and approval behind it."
      - strong [ref=e184]: When evidence changes, the decision must be checked again.
