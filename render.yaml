# Render Blueprint — AIDTRACE / Kairos demo deployment (free plan, no card needed).
#   aidtrace-api-vsr  FastAPI backend (Docker, ./backend), started via render_start.py
#   aidtrace-web-vsr  Next.js frontend (Docker, ./frontend); browser calls /api, Next proxies to the API's public URL
# Free services cannot receive private-network traffic, so the proxy target is the API's public onrender.com URL.
# No FalkorDB on the free plan: graph/drift routes report their store as unavailable.
# Secrets (ANTHROPIC_API_KEY) are sync:false: entered in the Render dashboard, never committed.
services:
  - type: web
    name: aidtrace-api-vsr
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: python render_start.py
    plan: free
    region: oregon
    healthCheckPath: /docs
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-opus-5-5
      - key: APP_ENV
        value: development
      - key: OTEL_SDK_DISABLED
        value: "true"
      - key: GREENCHAIN_DATA_DIR
        value: /app/domains/greenchain/data
      - key: CORS_ORIGINS
        value: '["*"]'

  - type: web
    name: aidtrace-web-vsr
    runtime: docker
    rootDir: frontend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: /api
      - key: BUILD_STANDALONE
        value: "true"
      - key: API_INTERNAL_URL
        value: https://aidtrace-api-vsr.onrender.com
