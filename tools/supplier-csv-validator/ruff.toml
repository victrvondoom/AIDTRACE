# Ruff configuration for the GreenChain supplier CSV validator.
# Default correctness rules plus the quality families enforced for this tool.
# Run from this directory:  ruff check .

line-length = 88

[lint]
pydocstyle.convention = "google"
select = [
    "A",    # flake8-builtins
    "ANN",  # flake8-annotations
    "ARG",  # flake8-unused-arguments
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "D",    # pydocstyle
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "FURB", # refurb
    "PERF", # perflint
    "PIE",  # flake8-pie
    "PL",   # pylint
    "PTH",  # flake8-use-pathlib
    "RET",  # flake8-return
    "RSE",  # flake8-rse
    "RUF",  # ruff-specific
    "SIM",  # flake8-simplify
    "TRY",  # tryceratops
    "UP",   # pyupgrade
    "W",    # pycodestyle warnings
]

[lint.per-file-ignores]
# Test methods are self-describing; annotations and docstrings there are noise.
"tests/*" = ["D", "ANN", "PLR2004"]
